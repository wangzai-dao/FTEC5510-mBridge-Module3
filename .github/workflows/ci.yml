name: Module 3 acceptance tests

on:
  push:
    paths:
      - "module3/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "module3/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Environment
        run: |
          python -V
          echo "stdlib only - no pip install step needed"

      - name: Acceptance tests
        run: python -m unittest discover -s module3/tests -v

      - name: Self-check on the fixed fixture
        run: |
          python module3/run_engine.py \
            --dataset module3/fixtures/fixed_demo \
            --strategy all --out ci_outputs

      - name: Publish summary
        if: always()
        run: |
          {
            echo "### Module 3 self-check - Python ${{ matrix.python-version }}"
            echo ""
            echo '```'
            python module3/run_engine.py \
              --dataset module3/fixtures/fixed_demo --strategy all --dry-run
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: module3-outputs-py${{ matrix.python-version }}
          path: ci_outputs
          retention-days: 7
